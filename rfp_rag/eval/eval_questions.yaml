# ---------------- RFP 멀티턴 (conv 가 같으면 이전 대화를 기억) ----------------
- {id: C1-1, set: RFP, conv: C1, category: 요구사항정리,
   question: "국민연금공단이 발주한 이러닝시스템 관련 사업 요구사항을 정리해 줘.", expect_orgs: [국민연금공단], expect_mode: single}
- {id: C1-2, set: RFP, conv: C1, category: 후속질문,
   question: "콘텐츠 개발 관리 요구 사항에 대해서 더 자세히 알려 줘.", expect_mode: inherit}
- {id: C1-3, set: RFP, conv: C1, category: 타기관탐색,
   question: "교육이나 학습 관련해서 다른 기관이 발주한 사업은 없나?", expect_mode: exclude}
- {id: C2-1, set: RFP, conv: C2, category: 존재확인,
   question: "기초과학연구원 극저온시스템 사업 요구에서 AI 기반 예측에 대한 요구사항이 있나?",
   expect_orgs: [기초과학연구원], expect_mode: single, must_include: ["없"],
   reference: "과업지시서에는 AI 기반 예측에 대한 요구사항이 없습니다. 과업은 중이온가속기용 극저온시스템 운전 업무(모니터링·제어·주요 수치 기록 및 분석·운전 경험 문서화)입니다."}
- {id: C2-2, set: RFP, conv: C2, category: 후속질문,
   question: "그럼 모니터링 업무에 대한 요청사항이 있는지 찾아보고 알려 줘.", expect_mode: inherit, must_include: ["24시간"],
   reference: "가동기간에는 24시간 운전으로 극저온시스템 모니터링, 주요 수치 기록 및 분석, 제어를 수행하고, 휴지기간에는 유지보수 등을 위한 극저온시스템 모니터링·제어·주요 수치 기록 및 분석을 수행해야 합니다."}
- {id: C3-1, set: RFP, conv: C3, category: 사업목적,
   question: "한국 원자력 연구원에서 선량 평가 시스템 고도화 사업을 발주했는데, 이 사업이 왜 추진되는지 목적을 알려 줘.",
   expect_orgs: [한국원자력연구원], expect_mode: single}
- {id: C4-1, set: RFP, conv: C4, category: 비교,
   question: "고려대학교 차세대 포털 시스템 사업이랑 광주과학기술원의 학사 시스템 기능개선 사업을 비교해 줄래?",
   expect_orgs: [고려대학교, 광주과학기술원], expect_mode: compare}
- {id: C4-2, set: RFP, conv: C4, category: 비교·정확성,
   question: "고려대학교랑 광주과학기술원 각각 응답 시간에 대한 요구사항이 있나? 문서를 기반으로 정확하게 답변해 줘.",
   expect_orgs: [고려대학교, 광주과학기술원], expect_mode: compare, must_include: ["3초"],
   reference: "고려대학교: PER-002 온라인성 업무응답시간은 모든 질의를 요청 시점부터 3초 내 처리, PER-003 웹페이지 디스플레이시간 3초 내, PER-004 오류응답시간은 입력 후 3초 이내 오류 메시지 제시를 요구합니다. (광주과학기술원 부분은 해당 문서 확인 후 보완)"}
