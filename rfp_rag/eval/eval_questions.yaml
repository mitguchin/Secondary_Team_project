- {id: T04, set: 연말정산, category: 띄어쓰기, qid: Q18, question: "기부금이월공제기간몇년",
   must_include: ["10년"],
   reference: "한도 초과로 공제받지 못한 기부금은 다음 과세기간부터 10년 이내에 이월하여 공제받을 수 있습니다."}
- {id: T05, set: 연말정산, category: 줄임말, qid: Q27, question: "중퇴자 연정 언제함?",
   must_include: ["퇴직", "5월"],
   reference: "중도퇴직자는 퇴직하는 달의 급여를 지급할 때 회사가 연말정산을 합니다. 퇴직 정산 때 반영하지 못한 공제는 다음 해 5월 종합소득세 확정신고로 추가 공제받을 수 있습니다."}
