# ============================================================
#  최종 평가 질문 세트 — 02_generate_eval.ipynb 에서 순서대로 답변 → 마지막에 RAGAS 일괄 측정
#
#  필드
#   id / set / category / qid(원 질문 번호) / conv(같은 값이면 한 대화: 이전 턴 기억)
#   question        : 입력 그대로 — 규칙·사전 전처리 없이 이 문장 그대로 검색·LLM 에 전달 (오타·한영·한자·영어 혼용 포함)
#   expect_orgs / expect_mode : 기관 라우팅 기대값                  → Route OK
#   must_include    : 답변에 꼭 있어야 할 핵심 사실 ('A|B' = 둘 중 하나) → Key Fact
#   reference       : 정답 (있으면 RAGAS context_recall·factual_correctness·context_precision(ref) 계산,
#                     없으면 참조 없는 지표만: faithfulness·answer_relevancy·context_precision(no-ref))
#
#  ⚠️ 연말정산 세트는 근거 문서(국세청 「연말정산 신고안내」 등)를 ZIP 에 넣어야 '문서 기반' 정답이 나옵니다.
#     RFP 코퍼스만 있으면 '제공된 문서에서 확인할 수 없습니다'가 정상 동작입니다.
#     reference 는 2025년 귀속(2026년 초 연말정산) 기준. 2026 세법개정안(월세 한도 1,200만원 등)은 국회 통과 후 반영.
# ============================================================
- {id: T01, set: 연말정산, category: 오타, qid: Q05, question: "월세액 세액공재 한도가 얼마에요?",
   must_include: ["1,000만"],
   reference: "월세액 세액공제 대상 월세액 한도는 연 1,000만원입니다(2024년 귀속부터 750만원에서 1,000만원으로 상향)."}
