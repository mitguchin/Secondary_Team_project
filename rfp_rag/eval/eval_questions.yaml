   must_include: ["2월"],
   reference: "근로소득 연말정산은 다음 해 2월분 급여를 지급할 때(통상 2월 말까지) 회사(원천징수의무자)가 실시합니다. 간소화 자료는 1월 15일경부터 홈택스에서 조회할 수 있습니다."}
