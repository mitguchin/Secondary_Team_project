# ============================================================
#  도메인 용어·오타 사전 (규칙 기반 전처리 ①) — 자유롭게 추가/수정
#  - typos / terms : 한국어 단어 경계 기준 치환 (왼쪽이 한글이 아니고, 오른쪽은 한글이 아니거나 조사)
#  - en_terms      : 영문 혼용 질의의 영어 용어 → 한국어 (대소문자·하이픈 무시)
#  - regex         : [패턴, 치환] 고급 규칙
#  - orgs          : 발주기관 표준명 → 별칭 (문서 라우팅·비교 질의에 사용)
# ============================================================
typos:
  연말졍산: 연말정산
  연말정싼: 연말정산
  연말 정산: 연말정산
  세액공재: 세액공제
  세엑공제: 세액공제
  소득공재: 소득공제
  차임금: 차입금
  월세액공제: 월세액 세액공제
  하나여: 하나요
  얼마에요: 얼마예요
  이월공재: 이월공제
  요구 사항: 요구사항
  제안 요청서: 제안요청서

terms:
  # 연말정산 도메인
  연정: 연말정산
  중퇴자: 중도퇴직자
  중도퇴사자: 중도퇴직자
  월세공제: 월세액 세액공제
  월세 공제: 월세액 세액공제
  주담대: 주택담보대출
  기부금이월공제: 기부금 이월공제
  외국인단일세율: 외국인근로자 단일세율
  지급조서: 지급명세서
  # RFP 도메인
  RFP: 제안요청서
  과지서: 과업지시서
  요구사항ID: 요구사항 고유번호
  응답속도: 응답시간

en_terms:
  monthly rent: 월세
  rent: 월세
  tax credit: 세액공제
  deduction: 공제
  deductions: 공제
  rate: 공제율
  flat tax: 단일세율
  year end tax settlement: 연말정산
  earned income payment statement: 근로소득 지급명세서
  payment statement: 지급명세서
  deadline: 제출기한
  foreigner: 외국인
  response time: 응답시간
  requirement: 요구사항
  requirements: 요구사항

regex:
  - ['몇\s*퍼(?=임|야|예요|에요|인가|\?|\s|$)', '몇 %']
  - ['(몇|\d)\s*연(?![가-힣])', '\1 년']          # 한자 年 두음법칙 보정: '몇 연' → '몇 년'
  - ['기부금이월공제기간몇년', '기부금 이월공제 기간 몇 년']
  - ['장기주택저당\s*차입금', '장기주택저당차입금']

orgs:
  국민연금공단: [국민연금공단, 국민연금, NPS]
  기초과학연구원: [기초과학연구원, IBS, 중이온가속기연구소, 중이온가속기]
  한국원자력연구원: [한국원자력연구원, 원자력연구원, 원자력연, KAERI]
  고려대학교: [고려대학교, 고려대, 고대]
  광주과학기술원: [광주과학기술원, GIST, 지스트, 광주과기원]
  한국국제협력단: [한국국제협력단, KOICA, 코이카]
  경기도사회서비스원: [경기도사회서비스원]
  경희대학교: [경희대학교, 경희대]
  서울특별시: [서울특별시, 서울시]
  한국수자원공사: [한국수자원공사, 수자원공사, K-water, 유역·지방상수도처, 수도사업장]
  서울시립대학교: [서울시립대학교, 서울시립대, 시립대]
